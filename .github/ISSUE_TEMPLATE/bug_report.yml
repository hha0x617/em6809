name: Bug report
description: Report a wrong instruction result, a crash, or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.  Reproducibility is the
        single most important detail — a minimal assembly or ROM snippet
        helps enormously.

  - type: input
    id: version
    attributes:
      label: em6809 version
      description: Release tag (e.g. `v0.1.0`) or commit hash
      placeholder: 1c2863a
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit the bug?
      options:
        - Standalone em6809 binary (GUI)
        - em6809 as a library (e.g. through emfe_plugin_mc6809)
        - Tests / CI
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce (minimal assembly / ROM welcome)
      placeholder: |
        ```
        ORG $1000
        LDA #$80
        SBCA #$01       ; borrow-in handling
        STA $2000
        ```
        Expected A = $7E, observed A = $7F
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / register dumps / screenshots
      render: shell
