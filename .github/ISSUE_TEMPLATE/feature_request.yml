name: Feature request
description: Suggest a new instruction, peripheral, GUI feature, or API addition
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - CPU core (ISA, addressing modes, cycles)
        - MMU (MC6829) / memory model
        - Peripherals / I/O devices
        - GUI (debugger, console, memory view, settings)
        - Public API (library surface for plugin consumers)
        - Build / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation — what problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: notes
    attributes:
      label: Additional context / references (datasheets, prior art)
