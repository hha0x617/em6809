[package]
name = "em6809"
default-run = "em6809"
version = "0.1.0"
edition = "2021"
authors = ["hha0x617 <hha0x617@gmail.com>"]
description = "MC6809 software emulator (cycle-counted core)"
repository = "https://github.com/hhagiwara/mc6809emu"
homepage = "https://github.com/hhagiwara/mc6809emu"
license = "MIT OR Apache-2.0"

[dependencies.eframe]
version = "0.29"

[dependencies]
winit = { version = "0.30" }
egui_extras = { version = "0.29" }
memmap2 = { version = "0.9" }
libc = "0.2"
objc = { version = "0.2", optional = true }
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
fluent-bundle = "0.16"
unic-langid = "0.9"
rust-embed = "8"
once_cell = "1"
image = { version = "0.24" }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lib]
name = "em6809"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = "allow"

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
