[package]
name = "em6809"
default-run = "em6809"
version = "0.1.0"
edition = "2021"
authors = ["hha0x617 <hha0x617@gmail.com>"]
description = "MC6809 software emulator (cycle-counted core)"
repository = "https://github.com/hhagiwara/mc6809emu"
homepage = "https://github.com/hhagiwara/mc6809emu"
license = "MIT OR Apache-2.0"

[dependencies.eframe]
version = "0.27"

[dependencies]
winit = { version = "0.29" }
egui_extras = { version = "0.27" }
memmap2 = { version = "0.9" }
libc = "0.2"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
fluent-bundle = "0.16"
unic-langid = "0.9"
rust-embed = "8"
once_cell = "1"

[lib]
name = "em6809"
path = "src/lib.rs"
